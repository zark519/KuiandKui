<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>情侶關係小檔案 💖</title>
    <style>
        :root {
            --primary-color: #ff7675;
            --secondary-color: #fab1a0;
            --bg-color: #ffeaa7;
            --card-bg: #ffffff;
            --text-color: #2d3436;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #fff1f2;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            color: var(--primary-color);
            font-size: 26px;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .key-id-tag {
            background: #ffeaa7;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            color: #d63031;
            display: inline-block;
        }
        /* 主頁記錄卡片 */
        .record-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 15px 20px;
            box-shadow: 0 8px 20px rgba(255, 118, 117, 0.15);
            margin-bottom: 10px;
            border: 2px dashed var(--secondary-color);
            position: relative;
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .record-card:hover {
            transform: translateY(-3px);
        }
        .card-left-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        /* 取消粗體，改為普通字重 */
        .card-line-1 {
            font-size: 16px;
            color: #e17055;
            font-weight: normal;
        }
        .card-line-2 {
            font-size: 13px;
            color: #636e72;
            font-weight: normal;
        }
        .delete-card-btn {
            background: #ff7675;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: opacity 0.2s;
        }
        .delete-card-btn:hover {
            opacity: 0.8;
        }

        /* 情侶配對群組與中間嘅心心分隔線 */
        .couple-group {
            background: #fff;
            border-radius: 18px;
            padding: 15px;
            box-shadow: 0 6px 15px rgba(255, 118, 117, 0.1);
            margin-bottom: 20px;
            border: 2px solid var(--secondary-color);
        }
        .couple-divider-line {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 15px 0;
            color: #e17055;
            font-weight: bold;
            font-size: 13px;
        }
        .couple-divider-line::before,
        .couple-divider-line::after {
            content: '';
            flex: 1;
            border-bottom: 2px dashed var(--primary-color);
        }
        .couple-divider-line:not(:empty)::before {
            margin-right: 15px;
        }
        .couple-divider-line:not(:empty)::after {
            margin-left: 15px;
        }
        .couple-divider-line span {
            background: #ffeaa7;
            padding: 4px 12px;
            border-radius: 20px;
            color: #d63031;
            border: 1px solid var(--primary-color);
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 16px;
            color: #b2bec3;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        /* 右下角 Floating + 按鈕 */
        .fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background-color: var(--primary-color);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: 0 4px 15px rgba(255, 118, 117, 0.4);
            cursor: pointer;
            border: none;
            transition: transform 0.2s;
            z-index: 100;
        }
        .fab:hover {
            transform: scale(1.1);
        }
        /* Modal Pop-up */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: white;
            width: 90%;
            max-width: 500px;
            max-height: 85vh;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            overflow-y: auto;
            box-sizing: border-box;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .modal-header h2 {
            margin: 0;
            font-size: 20px;
            color: var(--primary-color);
        }
        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #b2bec3;
        }
        /* 表單樣式 */
        .form-group {
            margin-bottom: 14px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 13px;
            color: #636e72;
        }
        input[type="text"], input[type="date"], input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #dfe6e9;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: var(--primary-color);
        }
        .btn-group {
            display: flex;
            gap: 8px;
        }
        .option-btn {
            flex: 1;
            padding: 10px 4px;
            border: 2px solid #dfe6e9;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            color: #636e72;
            transition: 0.2s;
            text-align: center;
        }
        .option-btn.selected {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }
        /* 動態自訂資訊行 */
        .custom-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            align-items: center;
        }
        .custom-row input {
            flex: 1;
        }
        .remove-row-btn {
            background: #ff7675;
            color: white;
            border: none;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .add-row-btn {
            background: #74b9ff;
            color: white;
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 14px;
        }
        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .submit-btn {
            flex: 2;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 118, 117, 0.3);
        }
        .submit-btn:hover {
            opacity: 0.9;
        }
        .delete-btn-modal {
            flex: 1;
            padding: 12px;
            background-color: #d63031;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .delete-btn-modal:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>✨ 拍拖同個人檔案記錄 ✨</h1>
        <div class="key-id-tag" id="displayKeyId">Key ID: 載入中...</div>
    </div>

    <!-- 主頁面顯示記錄 -->
    <div id="mainView">
        <div id="recordsContainer">
            <!-- 這裡會動態塞入記錄 -->
        </div>
    </div>

    <!-- 右下角 + 浮動按鈕 -->
    <button class="fab" onclick="openNewModal()">+</button>

    <!-- Modal 彈出填寫表單 -->
    <div class="modal" id="formModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">📝 填下/修改你嘅資料</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            
            <form id="profileForm" onsubmit="saveData(event)">
                <div class="form-group">
                    <label>User Name (網名)</label>
                    <input type="text" id="userName" required placeholder="例如：Kelvin_bb">
                </div>

                <div class="form-group">
                    <label>Instagram Account ID</label>
                    <input type="text" id="userId" required placeholder="例如：instagram (唔洗加 @)">
                </div>

                <div class="form-group">
                    <label>真實姓名</label>
                    <input type="text" id="realName" placeholder="例如：陳大文">
                </div>

                <!-- 生日或歲數 (選填) -->
                <div class="form-group">
                    <label>🎂 年齡 / 出生日期（選填）</label>
                    <div class="btn-group" style="margin-bottom: 6px;">
                        <button type="button" class="option-btn selected" id="typeAgeNumBtn" onclick="switchAgeInput('number')">直接填歲數</button>
                        <button type="button" class="option-btn" id="typeAgeDateBtn" onclick="switchAgeInput('date')">填出生日期</button>
                    </div>
                    <div id="ageNumberWrapper">
                        <input type="number" id="ageNumberInput" placeholder="例如：25 (歲)" min="0" max="150">
                    </div>
                    <div id="ageDateWrapper" style="display: none;">
                        <input type="date" id="birthDate">
                    </div>
                </div>

                <div class="form-group">
                    <label>性向（揀一個啦）</label>
                    <div class="btn-group">
                        <button type="button" class="option-btn selected" onclick="setSexuality('Gay')">Gay</button>
                        <button type="button" class="option-btn" onclick="setSexuality('直')">直</button>
                        <button type="button" class="option-btn" onclick="setSexuality('雙')">雙</button>
                    </div>
                    <input type="hidden" id="sexuality" value="Gay">
                </div>

                <div class="form-group">
                    <label>現任 IG ID（冇就留空，有就會自動幫你連埋一齊）</label>
                    <input type="text" id="currentUserId" placeholder="輸入現任 IG Account ID">
                </div>

                <div class="form-group">
                    <label>幾時開始成為情侶架？（揀輸入年份定係日子）</label>
                    <div class="btn-group" style="margin-bottom: 6px;">
                        <button type="button" class="option-btn selected" id="typeYearsBtn" onclick="switchCoupleInput('years')">填交往幾年</button>
                        <button type="button" class="option-btn" id="typeDateBtn" onclick="switchCoupleInput('date')">填確實日子</button>
                    </div>
                    <div id="coupleYearsWrapper">
                        <input type="number" id="coupleYearsInput" placeholder="例如：2.5 (代表兩年半)" step="0.1" min="0">
                    </div>
                    <div id="coupleDateWrapper" style="display: none;">
                        <input type="date" id="coupleDateInput">
                    </div>
                </div>

                <div class="form-group">
                    <label>前任 IG ID</label>
                    <input type="text" id="formerUserId" placeholder="輸入前任 IG Account ID">
                </div>

                <!-- 額外自訂資訊行 -->
                <div style="margin-top: 15px; border-top: 2px dashed #dfe6e9; padding-top: 15px;">
                    <label>💡 想加多啲其他資料？（例如：星座、IG、生日等）</label>
                    <div id="dynamicRowsContainer"></div>
                    <button type="button" class="add-row-btn" onclick="addCustomRow()">＋ 加多個資料欄位</button>
                </div>

                <div class="form-actions">
                    <button type="button" class="delete-btn-modal" id="modalDeleteBtn" onclick="deleteCurrentRecord()">刪除記錄 🗑️</button>
                    <button type="submit" class="submit-btn">儲存記錄 💖</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    let currentKeyId = '';

    function openNewModal() {
        currentKeyId = 'KEY-' + Math.random().toString(36).substr(2, 9).toUpperCase();
        document.getElementById('displayKeyId').innerText = 'Key ID: ' + currentKeyId;
        document.getElementById('modalTitle').innerText = '📝 新增個人檔案';
        document.getElementById('profileForm').reset();
        document.getElementById('dynamicRowsContainer').innerHTML = '';
        document.getElementById('modalDeleteBtn').style.display = 'none';
        setSexuality('Gay');
        switchAgeInput('number');
        switchCoupleInput('years');
        document.getElementById('formModal').classList.add('active');
    }

    function openEditModal(keyId) {
        let allRecords = JSON.parse(localStorage.getItem('app_records_cute') || '[]');
        let record = allRecords.find(r => r.keyId === keyId);
        if(!record) return;

        currentKeyId = record.keyId;
        document.getElementById('displayKeyId').innerText = 'Key ID: ' + currentKeyId;
        document.getElementById('modalTitle').innerText = '✏️ 編輯個人檔案';
        document.getElementById('modalDeleteBtn').style.display = 'block';

        document.getElementById('userName').value = record.userName || '';
        document.getElementById('userId').value = record.userId || '';
        document.getElementById('realName').value = record.realName || '';
        document.getElementById('currentUserId').value = record.currentUserId || '';
        document.getElementById('formerUserId').value = record.formerUserId || '';

        if(record.ageMode === 'date') {
            switchAgeInput('date');
            document.getElementById('birthDate').value = record.birthDate || '';
        } else {
            switchAgeInput('number');
            document.getElementById('ageNumberInput').value = record.ageNumber || '';
        }

        setSexuality(record.sexuality || 'Gay');

        if(record.coupleMode === 'date') {
            switchCoupleInput('date');
            document.getElementById('coupleDateInput').value = record.coupleDate || '';
        } else {
            switchCoupleInput('years');
            document.getElementById('coupleYearsInput').value = record.coupleYears || '';
        }

        const container = document.getElementById('dynamicRowsContainer');
        container.innerHTML = '';
        if(record.customFields && record.customFields.length > 0) {
            record.customFields.forEach(cf => {
                addCustomRow(cf.nature, cf.info);
            });
        }

        document.getElementById('formModal').classList.add('active');
    }

    function closeModal() {
        document.getElementById('formModal').classList.remove('active');
    }

    function deleteRecord(keyId, event) {
        if(event) event.stopPropagation();
        if(confirm('確定要刪除呢筆記錄嗎？')) {
            let allRecords = JSON.parse(localStorage.getItem('app_records_cute') || '[]');
            allRecords = allRecords.filter(r => r.keyId !== keyId);
            localStorage.setItem('app_records_cute', JSON.stringify(allRecords));
            renderMainPage();
        }
    }

    function deleteCurrentRecord() {
        if(confirm('確定要刪除呢筆記錄嗎？')) {
            let allRecords = JSON.parse(localStorage.getItem('app_records_cute') || '[]');
            allRecords = allRecords.filter(r => r.keyId !== currentKeyId);
            localStorage.setItem('app_records_cute', JSON.stringify(allRecords));
            closeModal();
            renderMainPage();
        }
    }

    let ageMode = 'number';
    function switchAgeInput(mode) {
        ageMode = mode;
        if(mode === 'number') {
            document.getElementById('typeAgeNumBtn').classList.add('selected');
            document.getElementById('typeAgeDateBtn').classList.remove('selected');
            document.getElementById('ageNumberWrapper').style.display = 'block';
            document.getElementById('ageDateWrapper').style.display = 'none';
        } else {
            document.getElementById('typeAgeDateBtn').classList.add('selected');
            document.getElementById('typeAgeNumBtn').classList.remove('selected');
            document.getElementById('ageDateWrapper').style.display = 'block';
            document.getElementById('ageNumberWrapper').style.display = 'none';
        }
    }

    function setSexuality(val) {
        const btns = document.querySelectorAll('.form-group .btn-group .option-btn');
        btns.forEach(b => {
            if(b.innerText === val) b.classList.add('selected');
            else b.classList.remove('selected');
        });
        document.getElementById('sexuality').value = val;
    }

    let coupleMode = 'years';
    function switchCoupleInput(mode) {
        coupleMode = mode;
        if(mode === 'years') {
            document.getElementById('typeYearsBtn').classList.add('selected');
            document.getElementById('typeDateBtn').classList.remove('selected');
            document.getElementById('coupleYearsWrapper').style.display = 'block';
            document.getElementById('coupleDateWrapper').style.display = 'none';
        } else {
            document.getElementById('typeDateBtn').classList.add('selected');
            document.getElementById('typeYearsBtn').classList.remove('selected');
            document.getElementById('coupleDateWrapper').style.display = 'block';
            document.getElementById('coupleYearsWrapper').style.display = 'none';
        }
    }

    function addCustomRow(nature = '', info = '') {
        const container = document.getElementById('dynamicRowsContainer');
        const row = document.createElement('div');
        row.className = 'custom-row';
        row.innerHTML = `
            <input type="text" placeholder="資料性質 (例如: IG)" class="custom-nature" value="${nature}">
            <input type="text" placeholder="資料內容 (例如: @abc)" class="custom-info" value="${info}">
            <button type="button" class="remove-row-btn" onclick="this.parentElement.remove()">🗑️</button>
        `;
        container.appendChild(row);
    }

    function getAgeText(r) {
        if(r.ageMode === 'number') {
            return r.ageNumber ? `${r.ageNumber}歲` : '';
        } else {
            if(!r.birthDate) return '';
            const birthDate = new Date(r.birthDate);
            const today = new Date();
            let age = today.getFullYear() - birthDate.getFullYear();
            const m = today.getMonth() - birthDate.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
                age--;
            }
            return `${age}歲`;
        }
    }

    function saveData(event) {
        event.preventDefault();

        const userId = document.getElementById('userId').value.trim();
        const currentIdRef = document.getElementById('currentUserId').value.trim();
        
        let allRecords = JSON.parse(localStorage.getItem('app_records_cute') || '[]');

        let customFieldsList = [];
        document.querySelectorAll('.custom-row').forEach(row => {
            const nature = row.querySelector('.custom-nature').value.trim();
            const info = row.querySelector('.custom-info').value.trim();
            if(nature) {
                customFieldsList.push({ nature, info });
            }
        });

        const formData = {
            keyId: currentKeyId,
            userName: document.getElementById('userName').value,
            userId: userId,
            realName: document.getElementById('realName').value,
            ageMode: ageMode,
            ageNumber: document.getElementById('ageNumberInput').value,
            birthDate: document.getElementById('birthDate').value,
            sexuality: document.getElementById('sexuality').value,
            currentUserId: currentIdRef,
            coupleMode: coupleMode,
            coupleYears: document.getElementById('coupleYearsInput').value,
            coupleDate: document.getElementById('coupleDateInput').value,
            formerUserId: document.getElementById('formerUserId').value,
            customFields: customFieldsList,
            updatedAt: new Date().toLocaleString()
        };

        const existingIdx = allRecords.findIndex(r => r.keyId === currentKeyId);
        if(existingIdx >= 0) {
            allRecords[existingIdx] = formData;
        } else {
            allRecords.push(formData);
        }

        localStorage.setItem('app_records_cute', JSON.stringify(allRecords));
        alert('成功儲存啦！ 🎉');
        closeModal();
        renderMainPage();
    }

    // 主頁卡片 HTML 產生器：第一行 User Name (User ID)，第二行 real name | age (if any)
    function createCardHtml(r) {
        const line1 = `${r.userName} (${r.userId})`;
        
        const realNameStr = r.realName ? r.realName : '';
        const ageStr = getAgeText(r);

        let line2Parts = [];
        if(realNameStr) line2Parts.push(realNameStr);
        if(ageStr) line2Parts.push(ageStr);
        const line2 = line2Parts.join(' | ');

        let line2Html = line2 ? `<div class="card-line-2">${line2}</div>` : '';

        return `
            <div class="record-card" onclick="openEditModal('${r.keyId}')">
                <div class="card-left-info">
                    <div class="card-line-1">${line1}</div>
                    ${line2Html}
                </div>
                <button class="delete-card-btn" onclick="deleteRecord('${r.keyId}', event)">刪除 🗑️</button>
            </div>
        `;
    }

    // 主頁面展示記錄（雙向檢查現任並組合）
    function renderMainPage() {
        const container = document.getElementById('recordsContainer');
        const allRecords = JSON.parse(localStorage.getItem('app_records_cute') || '[]');

        if(allRecords.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <h3>暫時未有任何記錄 📭</h3>
                    <p>快啲襟右下角個「 + 」掣加入第一筆資料啦！</p>
                </div>
            `;
            return;
        }

        let processedIds = new Set();
        let html = '';

        allRecords.forEach(r => {
            if(processedIds.has(r.keyId)) return;

            let partner = null;
            // 檢查雙向現任配對：A 嘅 currentUserId 等於 B 嘅 userId，且 B 嘅 currentUserId 等於 A 嘅 userId
            if(r.currentUserId) {
                partner = allRecords.find(p => p.userId === r.currentUserId && p.keyId !== r.keyId && p.currentUserId === r.userId);
            }

            if(partner) {
                processedIds.add(r.keyId);
                processedIds.add(partner.keyId);

                html += `
                    <div class="couple-group">
                        ${createCardHtml(r)}
                        <div class="couple-divider-line"><span>💖 Sweet Couple 💖</span></div>
                        ${createCardHtml(partner)}
                    </div>
                `;
            } else {
                processedIds.add(r.keyId);
                html += createCardHtml(r);
            }
        });

        container.innerHTML = html;
    }

    renderMainPage();
</script>

</body>
</html>
